<!--
  _includes/head-shared.html

  Shared <head> content for every page on the site: charset/viewport,
  favicon, fonts, stylesheets, and the vendor/site scripts. Pulled in via
  each page's YAML as `includes: in_header:`.

  This ONE file replaces the 49 near-identical header files that used to
  live in parables/headers/, blog/headers/, gospel-buddy/headers/,
  projects/conference/headers/ and projects/movie-draft/headers/. They were
  copy-paste clones of each other that differed only in <title> and Open
  Graph tags -- and had drifted (several pages were serving Open Graph tags
  copy-pasted from an unrelated article).

  This file intentionally does NOT contain <title> or Open Graph/Twitter
  meta tags -- those are page-specific and now live in each page's own .Rmd
  in a `header-includes:` block, e.g.:

    header-includes:
      - '<meta property="og:title" content="Page Title">'
      - '<meta property="og:description" content="One sentence about this page.">'
      - '<meta property="og:image" content="https://www.kameronyork.com/assets/img/some-image.png">'
      - '<meta property="og:url" content="https://www.kameronyork.com/path/">'

  That keeps the shared look in ONE place while letting every page have its
  own unique link-preview image/title/description.

  It also does NOT contain <!DOCTYPE>, <html>, <head> or <body> tags. The
  old header files were entire HTML documents injected into <head>, which
  produced invalid, multiply-nested markup. See the README for why that
  mattered for layout.
-->
