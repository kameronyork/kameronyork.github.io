<!--
  _includes/nav.html

  The single, canonical top nav bar for the whole site. Included on every
  page via `includes: before_body:`.

  Previously this exact markup was copy-pasted into all 49 header files.
  It had drifted between them: some linked to kameronyork.com, some to
  www.kameronyork.com, some to kameronyork.github.io; the parable headers
  carried an extra "Parable Home" item that no other section had; and the
  brand text ("Kameron York") appeared only on the hand-written homepage
  and was blank everywhere else.

  Now there is exactly one copy. The brand is a standardized "Home" link on
  every page, so there is always an obvious way back to the top of the site.
  Section-level "back" navigation is handled separately by the
  _includes/backbar-*.html partials -- see the README.
-->
<header class="shadow-bottom sticky-top bg-white gb-fullbleed">
  <nav class="navbar navbar-expand-md navbar-light">
    <div class="container">
      <a class="navbar-brand px-2" href="https://www.kameronyork.com/">Home</a>
      <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse text-center" id="navigation">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link text-dark" href="https://www.kameronyork.com/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="https://www.kameronyork.com/projects/">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="https://www.kameronyork.com/parables/">Parables</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="https://www.kameronyork.com/blog/">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="https://www.kameronyork.com/contact/">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
