  _includes/footer.html

  The single, canonical footer for the whole site. Included on every page
  via `includes: after_body:`.

  Moved here from parables/footer.html (an odd home for a site-wide footer)
  and fixed: the old file wrapped itself in its own
  <!DOCTYPE html><html><body>...</body></html>, which -- combined with the
  old header files doing the same at the other end -- produced invalid,
  multiply-nested HTML documents. This file now contains only the fragment
  that belongs at the end of <body>.
-->
